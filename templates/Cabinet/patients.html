{% extends 'base.html' %}{% block content %}<h1>Patients</h1><p><a class="btn" href="{% url 'ajouter_patient' %}">+ Ajouter un patient</a></p><div class="card"><form method="get"><input name="q" value="{{ q }}" placeholder="Rechercher par nom ou CIN"><button class="btn">Rechercher</button></form><table><tr><th>CIN</th><th>Nom complet</th><th>Téléphone</th><th>Email</th><th>Actions</th></tr>{% for p in patients %}<tr><td>{{ p.cin }}</td><td>{{ p.first_name }} {{ p.last_name }}</td><td>{{ p.telephone }}</td><td>{{ p.email }}</td><td class="actions"><a href="{% url 'modifier_patient' p.cin %}">Modifier</a><a href="{% url 'supprimer_patient' p.cin %}">Supprimer</a></td></tr>{% empty %}<tr><td colspan="5">Aucun patient.</td></tr>{% endfor %}</table></div>{% endblock %}
