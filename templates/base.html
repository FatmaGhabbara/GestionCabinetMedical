<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Gestion Cabinet Médical{% endblock %}</title><style>
:root{--green:#28745d;--pale:#eef6f1;--ink:#24352e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:var(--ink)}header{background:var(--green);color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;margin:0 9px}.container{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:white;border-radius:12px;padding:22px;margin:14px 0;box-shadow:0 2px 10px #0000000b}.btn{display:inline-block;background:var(--green);color:white;padding:9px 14px;border:0;border-radius:7px;text-decoration:none;cursor:pointer}.btn.secondary{background:#64756d}.btn.danger{background:#b64040}table{width:100%;border-collapse:collapse;background:white}th,td{padding:12px;border-bottom:1px solid #e7ece9;text-align:left}th{background:var(--pale)}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd7d1;border-radius:6px;margin:5px 0 12px}label{font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.number{font-size:30px;color:var(--green);font-weight:bold}.msg{padding:10px;background:#e5f5e9;border-radius:6px;margin:8px 0}.errorlist{color:#b22}.actions a{margin-right:8px}footer{text-align:center;color:#718078;padding:25px}
</style></head><body><header><strong>Cabinet Médical</strong><nav><a href="{% url 'accueil' %}">Accueil</a><a href="{% url 'liste_patients' %}">Patients</a><a href="{% url 'liste_medecins' %}">Médecins</a><a href="{% url 'liste_specialites' %}">Spécialités</a><a href="{% url 'liste_rendezvous' %}">Rendez-vous</a></nav>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="btn secondary">Déconnexion</button></form>{% endif %}</header><main class="container">{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Gestion Cabinet Médical — Application Django</footer></body></html>
